<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183647" />
    <title>Offline - Fikr Smart School System</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #183647;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 460px);
        text-align: center;
      }

      img {
        width: 76px;
        height: 76px;
        object-fit: contain;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.05;
      }

      p {
        margin: 0 0 24px;
        color: #526b7a;
        line-height: 1.65;
      }

      button {
        border: 0;
        border-radius: 12px;
        background: #183647;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
      }

      button:focus-visible {
        outline: 3px solid rgba(24, 54, 71, 0.28);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Fikr Smart School System" />
      <h1>You are offline</h1>
      <p>
        The school system is installed and ready, but this page needs an internet connection.
        Reconnect and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
